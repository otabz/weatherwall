name: Build SkyFlow Live Weather APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: skyflow-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Run tests and build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --console=plain \
            clean testDebugUnitTest assembleDebug

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            artifacts/SkyFlow-Live-Weather-debug.apk
          sha256sum artifacts/SkyFlow-Live-Weather-debug.apk \
            | tee artifacts/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyFlow-Live-Weather-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## SkyFlow Live Weather build'
            echo
            if [ -f artifacts/SkyFlow-Live-Weather-debug.apk ]; then
              echo 'The APK was built successfully.'
              echo
              echo 'Download the **SkyFlow-Live-Weather-APK** artifact below.'
            else
              echo 'The APK was not produced. Open the failed Gradle step for the complete error.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
